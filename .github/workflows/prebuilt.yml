# Builds the dependencies that no package manager ships as needed and publishes them as release assets,
# so consumers' CI downloads and verifies them instead of compiling. A merge that changes a version or kz-ffmpeg
# publishes deps-ffmpeg-<version>-<kz-ffmpeg digest>-cxxbridge-<version>; an existing release is never rebuilt,
# so its digests stay valid.
name: Prebuilt dependencies

on:
  push:
    branches: [master]
    paths: [tools/ffmpeg/kz-ffmpeg, .github/workflows/prebuilt.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CXXBRIDGE_VERSION: 1.0.205
  RUST_VERSION: 1.99.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ffmpeg=$(python3 -c "import runpy; print(runpy.run_path('tools/ffmpeg/kz-ffmpeg')['VERSION'])")
          # kz-ffmpeg holds the configure flags, so its digest gives a changed build a new tag.
          build=$(sha256sum tools/ffmpeg/kz-ffmpeg | cut -c1-12)
          tag="deps-ffmpeg-$ffmpeg-$build-cxxbridge-$CXXBRIDGE_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  ffmpeg:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          # The oldest glibc a consumer links against, so the static archives need no newer symbols.
          - { name: linux-x64, os: ubuntu-latest, container: 'debian:trixie-slim' }
          - { name: macos-arm64, os: macos-26 }
          # DLLs cross-compiled with llvm-mingw, the toolchain Windows consumers link them with.
          - { name: windows-x64, os: ubuntu-latest, container: 'debian:trixie-slim', target: windows-x64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      LLVM_MINGW: llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21
    steps:
      - name: Install the build tools
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends build-essential nasm python3 curl ca-certificates xz-utils
      - name: Install llvm-mingw
        if: matrix.target == 'windows-x64'
        run: |
          curl -fL --retry 3 -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf llvm-mingw.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Build
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('tools/ffmpeg/kz-ffmpeg')['VERSION'])")
          # ffmpeg.org drops some TLS handshakes, which plain --retry does not retry.
          curl -fL --retry 5 --retry-all-errors --retry-delay 15 -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-$version.tar.xz"
          target=${{ matrix.target }}
          python3 tools/ffmpeg/kz-ffmpeg ${target:+--target "$target"} --tarball ffmpeg.tar.xz --out "$PWD/out"
          tar -xJf ffmpeg.tar.xz -O "ffmpeg-$version/COPYING.LGPLv2.1" > out/COPYING.LGPLv2.1
          rm out/configure.log
          archive="kz-ffmpeg-$version-${{ matrix.name }}"
          if [ "$target" = windows-x64 ]; then
            (cd out && python3 -m zipfile -c "../$archive.zip" *)
          else
            tar -czf "$archive.tar.gz" -C out .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.name }}
          path: kz-ffmpeg-*
          if-no-files-found: error

  cxxbridge:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, container: 'debian:trixie-slim' }
          - { name: macos-arm64, os: macos-26 }
          # Without the static CRT the MSVC build needs vcruntime140.dll beside it.
          - { name: windows-x64, os: windows-2025, rustflags: '-C target-feature=+crt-static' }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Install the build tools
        if: runner.os == 'Linux'
        run: |
          apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Build
        run: |
          cargo install cxxbridge-cmd --version "$CXXBRIDGE_VERSION" --locked --root out
          archive="cxxbridge-$CXXBRIDGE_VERSION-${{ matrix.name }}"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$archive.zip" ./out/bin/cxxbridge.exe
          else
            tar -czf "$archive.tar.gz" -C out/bin cxxbridge
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cxxbridge-${{ matrix.name }}
          path: cxxbridge-*
          if-no-files-found: error

  release:
    needs: [plan, ffmpeg, cxxbridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cd assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Prebuilt LGPL FFmpeg (kz-ffmpeg) and cxxbridge-cmd $CXXBRIDGE_VERSION. Checksums in SHA256SUMS."
