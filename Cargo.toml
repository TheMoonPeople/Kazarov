[package]
name = "kazarov_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/rust/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "=1.0.205"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "=0.17.2"
gpt_disk_io = { version = "=0.16.2", features = ["std"] }
iso9660-rs = "=1.0.2"
png = "0.18.1"
rayon = "1.12.0"
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
