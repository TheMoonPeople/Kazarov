[package]
name = "kazarov_core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
path = "src/rust/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "=1.0.205"
crc32fast = "1.5.2"
encoding_rs = "=0.8.35"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
rfd = { version = "=0.17.2", optional = true }
gpt_disk_io = { version = "=0.16.2", features = ["std"] }
iso9660-rs = "=1.0.2"
memmap2 = "0.9.11"
png = "0.18.1"
rayon = "1.12.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
zstd = { version = "0.14.2", default-features = false }
libc = "0.2"

[features]
# The desktop setup window; iOS builds without it.
default = ["desktop-ui"]
desktop-ui = ["dep:eframe", "dep:rfd"]

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
cc = "1.2"
crc32fast = "1.5.2"
sha2 = "0.11.1"
zstd = { version = "0.14.2", default-features = false }
